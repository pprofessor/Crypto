[package]
name = "wallet-service"
version = "0.1.0"
edition = "2021"
description = "A secure cryptocurrency wallet management microservice"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.0"
actix-rt = "2.0"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
] } # حذف bigdecimal
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.13"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
# Test utilities
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "bigdecimal",
    "migrate",
] }
wiremock = "0.5"
testcontainers = "0.15" # Linting (اختیاری، برای کیفیت کد)
# rustfmt = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
